name: Sync Erasmus calls

on:
  schedule:
    - cron: '0 7 */2 * *'   # every 2 days at 07:00 UTC
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # PAT owned by a repo admin so the auto-commit can bypass the
          # branch-protection ruleset (signed commits / PR-only) that blocks
          # the default GITHUB_TOKEN. Falls back to the default token if the
          # secret is not set (push will then be skipped by the ruleset).
          token: ${{ secrets.ERASMUS_SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Sync Erasmus calls
        run: npm run sync-erasmus
        timeout-minutes: 10

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/erasmus-calls.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: sync Erasmus calls from uni-pr.edu"
            git push
          fi
