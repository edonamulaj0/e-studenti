name = "r2-catalog-manager"
main = "src/index.js"
compatibility_date = "2024-01-01"

# R2 Bucket Binding
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "e-studenti-materials"  # Replace with your actual R2 bucket name

# CORS settings for the worker
[env.production]
vars = { ENVIRONMENT = "production" }
