name = "r2-catalog-manager"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Before deploying the worker, make sure these existing R2 buckets exist:
# - e-studenti-materials
# - materials-metadata
# - department-materials
# wrangler secret put JWT_SECRET
# wrangler secret put RESEND_API_KEY
#
# Bulk upload (presigned direct-to-R2). Not needed until that ships; without
# them the worker simply cannot presign. Generate an R2 API token in the
# Cloudflare dashboard under R2 > Manage API Tokens, scoped to Object Read &
# Write on the quarantine and materials buckets only:
# wrangler secret put R2_ACCOUNT_ID          (Cloudflare account ID)
# wrangler secret put R2_ACCESS_KEY_ID       (from the R2 API token)
# wrangler secret put R2_SECRET_ACCESS_KEY   (from the R2 API token, shown once)
# Optional: wrangler secret put ADMIN_EMAIL (copies contact-form messages to an admin inbox)
# Optional: wrangler secret put MODERATOR_EMAILS (comma-separated emails granted moderator access)
# Optional if your domain differs from defaults:
# wrangler secret put JWT_ISSUER
# wrangler secret put JWT_AUDIENCE
# wrangler secret put ALLOWED_ORIGINS
# npm run deploy (from cloudflare-worker/)
#
# Resend setup:
# 1. Go to resend.com, create free account
# 2. Add and verify your sending domain (or use onboarding@resend.dev for dev)
# 3. Create API key, run: wrangler secret put RESEND_API_KEY
# 4. Optional custom senders:
#    wrangler secret put RESEND_VERIFY_FROM
#    wrangler secret put RESEND_CONTACT_FROM

# R2 Bucket Binding
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "e-studenti-materials"

# Quarantine for presigned uploads. A separate bucket rather than a prefix
# inside e-studenti-materials, because media.e-studenti.com is a public custom
# domain bound to that bucket: anything under a prefix there would be readable
# at media.e-studenti.com/<prefix>/... the instant it was written, before
# validation had run. No custom domain is attached to this bucket, so there is
# no URL that serves it — safe by construction rather than by a rule that could
# be edited away. Create it with: wrangler r2 bucket create e-studenti-uploads
[[r2_buckets]]
binding = "UPLOAD_BUCKET"
bucket_name = "e-studenti-uploads"

[[r2_buckets]]
binding = "METADATA_BUCKET"
bucket_name = "materials-metadata"

[[r2_buckets]]
binding = "DEPARTMENT_BUCKET"
bucket_name = "department-materials"

[[d1_databases]]
binding = "DB"
database_name = "e-studenti-auth"
database_id = "3d406171-fabe-44be-8e9c-d68e15ffaa39"
migrations_dir = "./migrations"

[triggers]
crons = ["0 * * * *"]

# Environment variables
[vars]
ENVIRONMENT = "production"

# CORS settings for the worker
[env.production]
vars = { ENVIRONMENT = "production" }
